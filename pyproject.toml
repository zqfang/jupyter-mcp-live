[build-system]
requires = ["hatchling>=1.5"]
build-backend = "hatchling.build"

[project]
name = "jupyter_mcp_executor"
authors = [{name = "Zhuoqing Fang", email = "fzq518@gmail.com"}]
description = "MCP server extension for Jupyter Server to execute code and manage notebooks via AI assistants"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["Jupyter", "Execution", "MCP", "FastMCP", "Code Execution", "Kernels"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Framework :: Jupyter",
]

dependencies = [
    # >=2.19: what jupyter-server-ydoc 3.0 requires (we need >=2.16, the
    # first release that awaits ExtensionApp start hooks)
    "jupyter_server>=2.19,<3",
    # Imported directly (mcp_handler, asgi_bridge). >=6.5.9: fixes for
    # pre-authentication request-parsing DoS advisories (GHSA-3hv7-mjh2-fv65,
    # CVE-2026-82397 and others), reachable before the MCP handler runs
    "tornado>=6.5.9",
    # >=4.1: first release with pydantic-monty 1.x, whose sandbox clock pauses
    # during tool calls (see build_sandbox_limits) and that propagates MCP
    # cancellation into tools called from Code Mode
    "fastmcp[code-mode]>=4.1,<5",
    # >=5.1: cell ids (NbformatAdapter returns new cells' ids)
    "nbformat>=5.1",
    # 5.x (jupyter-server-ydoc 3.x): YDocExtension.get_document(create=True)
    # recreates cleaned-up rooms (ydoc_helpers.ensure_ynotebook)
    "jupyter-collaboration>=5.0,<6",
    # >=4.1.1: what jupyter-server-ydoc 3.0 requires
    "jupyter_ydoc>=4.1.1",
    "pycrdt>=0.8.0",
]

[project.optional-dependencies]
test = [
    "ruff==0.17.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.24",  # pytest.ini sets asyncio_default_fixture_loop_scope
    "pytest-jupyter[server]>=0.6",
    "pytest-tornasync>=0.6.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=5"
]
dev = [
    "ruff==0.17.0"
]

[project.license]
file="LICENSE"

[project.urls]
Homepage = "https://github.com/zqfang/jupyter-mcp-executor"
Repository = "https://github.com/zqfang/jupyter-mcp-executor"
"Bug Tracker" = "https://github.com/zqfang/jupyter-mcp-executor/issues"
Changelog = "https://github.com/zqfang/jupyter-mcp-executor/blob/main/CHANGELOG.md"

[project.entry-points."jupyter_server.extension_points"]
jupyter_mcp_executor = "jupyter_mcp_executor.extension:MCPExtensionApp"

[tool.hatch.version]
path = "jupyter_mcp_executor/__init__.py"

[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config" = "etc/jupyter"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "BLE", # flake8-blind-except
    "I",   # isort
    "ARG", # flake8-unused-arguments
    "C4",  # flake8-comprehensions
    "EM",  # flake8-errmsg
    "ICN", # flake8-import-conventions
    "ISC", # flake8-implicit-str-concat
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "EXE", # flake8-executable
]
ignore = [
    "PLR",    # Design related pylint codes
    "ISC001", # Conflicts with formatter
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
# Fakes mirror the real signatures, so unused arguments are expected there
"tests/**" = ["T20", "ARG"]
