name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.x']
        deps: ['latest']
        include:
          # Oldest supported versions: Python, fastmcp and Jupyter Server.
          - os: ubuntu-latest
            python-version: '3.11'
            deps: 'oldest'

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "${{ matrix.deps }}" = "oldest" ]; then
          pip install -e .[test] "fastmcp[code-mode]==4.1.0" "jupyter_server==2.16.0"
        else
          pip install -e .[test]
        fi
    
    - name: Run linting
      run: |
        # Same ruff version as pyproject.toml: rule sets change between releases
        pip install "ruff==0.17.0"
        # Check linting and formatting
        ruff check jupyter_mcp_executor
        ## fix check
        ## ruff check --fix jupyter_mcp_executor
        ruff format --check jupyter_mcp_executor
        ## fix format
        ## ruff format jupyter_mcp_executor
    
    - name: Run unit tests
      run: |
        pytest tests/ -v -m "not slow and not integration"
    
    - name: Run integration tests
      run: |
        pytest tests/ -v -m "integration"