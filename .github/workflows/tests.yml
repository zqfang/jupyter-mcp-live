name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.x']
        deps: ['latest']
        include:
          # Oldest supported versions: Python, fastmcp, Jupyter Server and
          # jupyter-collaboration (first with get_document(create=True)).
          - os: ubuntu-latest
            python-version: '3.11'
            deps: 'oldest'
          # Every other supported minor version (3.x is the newest).
          - os: ubuntu-latest
            python-version: '3.12'
            deps: 'latest'
          - os: ubuntu-latest
            python-version: '3.13'
            deps: 'latest'

    steps:
    # Actions are pinned by commit SHA (a tag can be moved); Dependabot
    # (.github/dependabot.yml) proposes updates.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "${{ matrix.deps }}" = "oldest" ]; then
          pip install -e .[test] "fastmcp[code-mode]==4.1.0" "jupyter_server==2.16.0" \
            "jupyter-collaboration==4.4.0" "jupyter-server-ydoc==2.4.0" \
            "tornado==6.5.9"
        else
          pip install -e .[test]
        fi
    
    - name: Run linting
      run: |
        # Same ruff version as pyproject.toml: rule sets change between releases
        pip install "ruff==0.17.0"
        # Check linting and formatting (fix locally with `ruff check --fix` and
        # `ruff format`)
        ruff check jupyter_mcp_executor tests
        ruff format --check jupyter_mcp_executor tests
    
    # Once per run: the installed (latest) dependencies have no known
    # vulnerabilities.
    - name: Check dependency advisories
      if: matrix.os == 'ubuntu-latest' && matrix.deps == 'latest' && matrix.python-version == '3.x'
      run: |
        pip install pip-audit
        pip-audit --skip-editable

    # Coverage is measured once per run (unit + integration, appended).
    - name: Run unit tests
      shell: bash
      run: |
        if [ "${{ matrix.os }}-${{ matrix.deps }}-${{ matrix.python-version }}" = "ubuntu-latest-latest-3.x" ]; then
          COV="--cov=jupyter_mcp_executor --cov-report="
        fi
        pytest tests/ -v -m "not slow and not integration" $COV

    # Everything under tests/integration/ is marked automatically (its
    # conftest.py): a real Jupyter Server, real kernels, real YDoc rooms.
    - name: Run integration tests
      shell: bash
      run: |
        if [ "${{ matrix.os }}-${{ matrix.deps }}-${{ matrix.python-version }}" = "ubuntu-latest-latest-3.x" ]; then
          COV="--cov=jupyter_mcp_executor --cov-append --cov-report="
        fi
        pytest tests/ -v -m "integration" $COV

    - name: Coverage report
      if: matrix.os == 'ubuntu-latest' && matrix.deps == 'latest' && matrix.python-version == '3.x'
      run: |
        coverage report --skip-covered --sort=cover
        { echo '### Coverage'; echo '```'; coverage report --skip-covered --sort=cover; echo '```'; } >> "$GITHUB_STEP_SUMMARY"