name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.x']
        deps: ['latest']
        include:
          # Oldest supported versions: Python, fastmcp, Jupyter Server and
          # jupyter-collaboration (first with get_document(create=True)).
          - os: ubuntu-latest
            python-version: '3.11'
            deps: 'oldest'

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "${{ matrix.deps }}" = "oldest" ]; then
          pip install -e .[test] "fastmcp[code-mode]==4.1.0" "jupyter_server==2.16.0" \
            "jupyter-collaboration==4.4.0" "jupyter-server-ydoc==2.4.0" \
            "tornado==6.5.9"
        else
          pip install -e .[test]
        fi
    
    - name: Run linting
      run: |
        # Same ruff version as pyproject.toml: rule sets change between releases
        pip install "ruff==0.17.0"
        # Check linting and formatting (fix locally with `ruff check --fix` and
        # `ruff format`)
        ruff check jupyter_mcp_executor tests
        ruff format --check jupyter_mcp_executor tests
    
    # Once per run: the installed (latest) dependencies have no known
    # vulnerabilities.
    - name: Check dependency advisories
      if: matrix.os == 'ubuntu-latest' && matrix.deps == 'latest'
      run: |
        pip install pip-audit
        pip-audit --skip-editable

    - name: Run unit tests
      run: |
        pytest tests/ -v -m "not slow and not integration"

    # Everything under tests/integration/ is marked automatically (its
    # conftest.py): a real Jupyter Server, real kernels, real YDoc rooms.
    - name: Run integration tests
      run: |
        pytest tests/ -v -m "integration"