[pytest]
minversion = 7.0
# Coverage is opt-in: add --cov=jupyter_mcp_live (pytest-cov is a test extra)
addopts = -ra --strict-markers --strict-config
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
# strict: async tests opt in with @pytest.mark.asyncio. tests/integration/ is
# run by pytest-jupyter's own event loop and must not be claimed by
# pytest-asyncio (which "auto" mode would do).
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
# Warnings are errors when they come from this package (e.g. a deprecated API
# we call) or are leaks (unclosed sockets, databases, streams; reported from
# __del__ as unraisable exceptions). tests/integration/conftest.py relaxes the
# leak part for the real-server tests: upstream FastMCP and YDoc code leaks.
# Later lines take precedence.
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
    error:::jupyter_mcp_live.*
