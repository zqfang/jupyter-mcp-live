[pytest]
minversion = 7.0
# Coverage is opt-in: install pytest-cov, then add --cov=jupyter_mcp_executor
addopts = -ra --strict-markers --strict-config
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
# strict: async tests opt in with @pytest.mark.asyncio. tests/integration/ is
# run by pytest-jupyter's own event loop and must not be claimed by
# pytest-asyncio (which "auto" mode would do).
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
